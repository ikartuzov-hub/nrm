<style>
:root{
  --bg:#080D11; --surface:#101820; --raise:#17222C; --line:#20303C;
  --ink:#E9EFF2; --muted:#7F929E; --accent:#17998A; --accent-hi:#4FC3B0; --warn:#D9A441;
  --shadow:0 12px 36px rgba(0,0,0,.5); --icon-bg:#17998A;
}
[data-theme="light"]{
  --bg:#F2F5F4; --surface:#FFFFFF; --raise:#E9F1EF; --line:#D8E3E0;
  --ink:#0C1417; --muted:#5F7078; --accent:#0E7C6B; --accent-hi:#0E7C6B; --warn:#9A6F17;
  --shadow:0 10px 28px rgba(12,30,28,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5;padding-bottom:134px;transition:background .3s,color .3s}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:3px}

/* topbar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:560px;margin:0 auto;padding:14px 20px 0}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:9px;display:block}
.brand .wm{font-family:Fraunces,serif;font-size:21px;letter-spacing:.01em}
.ctrls{display:flex;gap:9px}
.orb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;letter-spacing:.04em}
.langbox{position:relative}
.langmenu{position:absolute;right:0;top:47px;background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:5px;display:none;min-width:140px;z-index:40}
.langmenu.on{display:block}
.langmenu button{display:flex;width:100%;align-items:center;gap:9px;background:none;border:none;color:var(--ink);padding:9px 11px;border-radius:9px;font-size:14px}
.langmenu button:hover{background:var(--raise)}
.langmenu button[aria-current="true"]{color:var(--accent-hi)}

/* hero + wow */
.head{padding:20px 0 4px;display:flex;gap:16px;align-items:flex-start}
.head .txt{flex:1;min-width:0}
.eye{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-hi)}
h1{font-family:Fraunces,serif;font-weight:300;font-size:31px;line-height:1.1;margin:8px 0 8px;letter-spacing:-.01em}
.lede{font-size:14px;color:var(--muted)}
.wow{flex:none;width:86px;height:96px}
.wow .seat{stroke:var(--line);stroke-width:2;fill:none;stroke-dasharray:5 5}
.wow .fig{stroke:var(--accent-hi);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:240;stroke-dashoffset:240}
.wow .figfill{fill:var(--accent);opacity:0}
.filling .fig{animation:draw 1.15s cubic-bezier(.4,0,.2,1) forwards}
.filling .figfill{animation:soak .7s .85s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes soak{to{opacity:.16}}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 4px}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:13px;padding:13px 10px;text-align:left}
.tab b{display:block;font-size:14.5px;color:var(--ink);font-weight:600}
.tab span{font-size:11.5px}
.tab[aria-pressed="true"]{border-color:var(--accent);background:var(--raise)}
.tab[aria-pressed="true"] b{color:var(--accent-hi)}

.q{margin-top:22px}
.q h3{font-size:13px;font-weight:600;margin-bottom:3px}
.q .note{font-size:12px;color:var(--muted);margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:7px}
.o{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;text-align:left;color:var(--ink);width:100%}
.o .dot{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted);position:relative}
.o[aria-pressed="true"]{border-color:var(--accent);background:var(--raise)}
.o[aria-pressed="true"] .dot{border-color:var(--accent-hi)}
.o[aria-pressed="true"] .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent-hi)}
.o .t{flex:1;font-size:14px}
.o .t small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.o .v{font-family:Fraunces,serif;font-size:15px;color:var(--muted);white-space:nowrap}
.o[aria-pressed="true"] .v{color:var(--accent-hi)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.row .o{flex-direction:column;gap:4px;text-align:center;padding:12px 6px}
.row .o .dot{display:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px}
.toggle .tt{font-size:14px}
.sw{flex:none;width:46px;height:27px;border-radius:99px;background:var(--line);border:none;position:relative;transition:background .18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--muted);transition:transform .18s,background .18s}
.sw[aria-pressed="true"]{background:var(--accent)}
.sw[aria-pressed="true"]::after{transform:translateX(19px);background:#fff}

/* result bar */
.res{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
.res-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.res .lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.res .big{font-family:Fraunces,serif;font-size:31px;color:var(--accent-hi);line-height:1.12}
.res .big.pulse{animation:pop .42s ease}
@keyframes pop{0%{opacity:.35;transform:translateY(4px)}100%{opacity:1;transform:none}}
.res .sub{font-size:11.5px;color:var(--muted)}
.mini{flex:none;width:44px;height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center}
.mini svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;overflow-y:auto;padding:24px 20px 40px}
.sheet.on{display:block}
.sheet-in{max-width:560px;margin:0 auto}
.sheet h2{font-family:Fraunces,serif;font-weight:400;font-size:25px;margin-bottom:4px}
.s-sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.brk{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin-bottom:15px}
.brk .r{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
.brk .r:last-child{border-bottom:none}
.brk .r.total{background:var(--raise)}
.brk .r.total .rv{font-family:Fraunces,serif;font-size:21px;color:var(--accent-hi)}
.rk{color:var(--muted)} .rv{font-weight:500;white-space:nowrap}
.cond{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:15px}
.cond h4{font-size:13px;margin-bottom:9px}
.cond li{list-style:none;font-size:13px;color:var(--muted);padding-left:19px;position:relative;margin-bottom:7px}
.cond li::before{content:"—";position:absolute;left:0;color:var(--accent-hi)}
.warn{border:1px solid var(--warn);border-radius:14px;padding:15px;font-size:13px;margin-bottom:15px}
.warn b{color:var(--warn)}
.src{font-size:11.5px;color:var(--muted);line-height:1.7;margin-bottom:18px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{border-radius:12px;padding:14px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#04100D}
[data-theme="light"] .btn.pri{color:#fff}
.close{margin-top:9px;width:100%;background:none;border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:13px;font-size:13.5px}

footer{padding:34px 0 60px;text-align:center;font-size:15px;color:var(--muted)}
footer a{color:var(--muted);text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px;display:inline-block;padding:8px 4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
  .wow .fig{stroke-dashoffset:0}.wow .figfill{opacity:.16}}
</style>
</head>

/* ---------- Слой 1: движок ---------- */
const $=s=>document.querySelector(s);
const LOC={pt:'pt-PT',en:'en-GB',ru:'ru-RU',es:'es-ES',de:'de-DE'};
const P=new URLSearchParams(location.search);
let lang=P.get('lang')||localStorage.getItem('nrm.lang')||(navigator.languages||[navigator.language||'pt']).map(l=>l.slice(0,2).toLowerCase()).find(l=>T[l])||'pt';
if(!T[lang])lang='pt';
let theme=P.get('theme')||localStorage.getItem('nrm.theme')||'dark';
let mode='pic', who='y35', con='st', maj=false, hours=40, lvl='n4', prem='premSt';

const money=v=>new Intl.NumberFormat(LOC[lang],{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v);
const money2=v=>new Intl.NumberFormat(LOC[lang],{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2}).format(v);

function calc(){
  if(mode==='pic'){
    const base=PIC[who][con]*RMMG, withMaj=maj?base*1.1:base;
    return {base,withMaj,total:withMaj*(hours/40)};
  }
  const month=EPM[lvl], year=month*12;
  const p=prem==='premSt'?8*RMMG:prem==='premTc'?4*RMMG:0;
  return {month,year,prem:p,bolsa:BOLSA[lvl],total:year+p};
}

function form(){
  const t=T[lang];
  $('#form').innerHTML = mode==='pic' ? `
    <div class="q"><h3>${t.qWho}</h3><div class="note">${t.qWhoN}</div><div class="opts">
      ${[['y35',t.y35,t.y35s],['m6',t.m6,''],['ld',t.ld,t.ld_s],['a55',t.a55,''],['dis',t.dis,'']]
        .map(([k,n,s])=>`<button class="o" data-k="who" data-v="${k}" aria-pressed="${who===k}"><span class="dot"></span><span class="t">${n}${s?`<small>${s}</small>`:''}</span><span class="v">${money(PIC[k][con]*RMMG)}</span></button>`).join('')}
    </div></div>
    <div class="q"><h3>${t.qCon}</h3><div class="note">${t.qConN}</div><div class="opts">
      <button class="o" data-k="con" data-v="st" aria-pressed="${con==='st'}"><span class="dot"></span><span class="t">${t.st}</span><span class="v">${money(PIC[who].st*RMMG)}</span></button>
      <button class="o" data-k="con" data-v="tc" aria-pressed="${con==='tc'}"><span class="dot"></span><span class="t">${t.tc}<small>${t.tcs}</small></span><span class="v">${money(PIC[who].tc*RMMG)}</span></button>
    </div></div>
    <div class="q"><h3>${t.qMaj}</h3><div class="note">${t.qMajN}</div>
      <div class="toggle"><div class="tt">${maj?t.majOn:t.majOff}</div><button class="sw" id="majSw" aria-pressed="${maj}" aria-label="+10%"></button></div></div>
    <div class="q"><h3>${t.qTime}</h3><div class="note">${t.qTimeN}</div><div class="row">
      ${[40,30,20].map(h=>`<button class="o" data-k="hours" data-v="${h}" aria-pressed="${hours===h}"><span class="t">${h}h</span></button>`).join('')}
    </div></div>` : `
    <div class="q"><h3>${t.qLvl}</h3><div class="note">${t.qLvlN}</div><div class="opts">
      ${['n4','n5','n6','n7','n8'].map(k=>`<button class="o" data-k="lvl" data-v="${k}" aria-pressed="${lvl===k}"><span class="dot"></span><span class="t">${k.toUpperCase().replace('N','')} · ${t.qLvl.split(' ')[0]}<small>${t.rBolsa}: ${money2(BOLSA[k])}</small></span><span class="v">${money2(EPM[k])}</span></button>`).join('')}
    </div></div>
    <div class="q"><h3>${t.qPrem}</h3><div class="note">${t.qPremN}</div><div class="opts">
      ${[['premSt',t.premSt,8*RMMG],['premTc',t.premTc,4*RMMG],['premNo',t.premNo,0]]
        .map(([k,n,v])=>`<button class="o" data-k="prem" data-v="${k}" aria-pressed="${prem===k}"><span class="dot"></span><span class="t">${n}</span><span class="v">${v?money(v):'—'}</span></button>`).join('')}
    </div></div>`;
}

function result(){
  const t=T[lang], c=calc();
  $('#resLbl').textContent = mode==='pic'?t.lblPic:t.lblEp;
  $('#resBig').textContent = money(Math.round(c.total));
  $('#resSub').textContent = mode==='pic'?t.subPic:t.subEp;
  const b=$('#resBig'); b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse');
  const w=$('#wow'); w.classList.remove('filling'); void w.offsetWidth; w.classList.add('filling');
}

function sheet(){
  const t=T[lang], c=calc();
  $('#shTitle').textContent=t.shTitle;
  $('#shSub').textContent = mode==='pic'?t.tabPicS:t.tabEpS;
  const R=(k,v)=>`<div class="r"><span class="rk">${k}</span><span class="rv">${v}</span></div>`;
  $('#shBrk').innerHTML = mode==='pic'
    ? R(t.rBase,money2(c.base)) + (maj?R(t.rMaj,'+ '+money2(c.withMaj-c.base)):'') + (hours!==40?R(t.rTime,hours+'/40'):'')
      + `<div class="r total"><span class="rk">${t.rTotal}</span><span class="rv">${money2(c.total)}</span></div>`
    : R(t.rMonth,money2(c.month)) + R(t.rYear,money2(c.year)) + (c.prem?R(t.rPrem,money2(c.prem)):'') + R(t.rBolsa,money2(c.bolsa))
      + `<div class="r total"><span class="rk">${t.rTotal}</span><span class="rv">${money2(c.total)}</span></div>`;
  $('#shCond').innerHTML=[t.c1,t.c2,t.c3,t.c4,t.c5,t.c6].map(x=>`<li>${x}</li>`).join('');
  $('#shWarn').innerHTML=t.warn;
  $('#shSrc').textContent = mode==='pic'?t.srcPic:t.srcEp;
}

function statics(){
  const t=T[lang];
  document.querySelectorAll('[data-t]').forEach(el=>{if(t[el.dataset.t]!==undefined)el.textContent=t[el.dataset.t]});
  document.documentElement.lang=lang;
  $('#langBtn').textContent=t.lg;
  document.querySelectorAll('#langMenu button').forEach(b=>b.setAttribute('aria-current',b.dataset.lang===lang));
  $('#yr').textContent=new Date().getFullYear();
  $('#hubLink').href='https://seedwave.pt/hub/?lang='+lang+'&theme='+theme;
}
function paint(){statics();form();result();}

function applyTheme(){
  document.documentElement.dataset.theme=theme;
  $('#themeIcon').textContent=theme==='dark'?'☾':'☀';
  document.querySelector('meta[name=theme-color]').content=theme==='dark'?'#080D11':'#F2F5F4';
  localStorage.setItem('nrm.theme',theme);
}

async function share(){
  const t=T[lang];
  const url='https://contratar.seedwave.pt/?lang='+lang;
  const text=t.shareText+' '+url;
  try{ if(navigator.share){ await navigator.share({title:'nRm — '+t.h1,text:t.shareText,url}); return; } }catch(e){}
  try{ await navigator.clipboard.writeText(text);
    const b=$('#shareBtn2'); if(b){const o=b.textContent;b.textContent=t.shareCopied;setTimeout(()=>b.textContent=o,1800);}
  }catch(e){}
}

document.addEventListener('click',e=>{
  const o=e.target.closest('.o');
  if(o){const k=o.dataset.k,v=o.dataset.v;
    if(k==='hours')hours=+v; else if(k==='who')who=v; else if(k==='con')con=v;
    else if(k==='lvl')lvl=v; else if(k==='prem')prem=v;
    form();result();return;}
  if(e.target.closest('#majSw')){maj=!maj;form();result();return;}
  const tb=e.target.closest('.tab');
  if(tb){mode=tb.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',x===tb));paint();return;}
  const lg=e.target.closest('[data-lang]');
  if(lg){lang=lg.dataset.lang;localStorage.setItem('nrm.lang',lang);paint();return;}
  if(!e.target.closest('#langBtn'))$('#langMenu').classList.remove('on');
});
$('#langBtn').addEventListener('click',e=>{e.stopPropagation();
  const m=$('#langMenu');m.classList.toggle('on');
  $('#langBtn').setAttribute('aria-expanded',m.classList.contains('on'));});
$('#themeBtn').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';applyTheme();});
$('#detBtn').addEventListener('click',()=>{sheet();$('#sheet').classList.add('on');});
$('#shClose').addEventListener('click',()=>$('#sheet').classList.remove('on'));
$('#shareBtn').addEventListener('click',share);
$('#shareBtn2').addEventListener('click',share);
$('#askBtn').addEventListener('click',()=>{window.open(BOT+'_'+lang,'_blank','noopener');});

applyTheme(); paint();
</script>
</body>
</html>
